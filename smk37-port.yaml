# smk37-port.yaml: every decision for one SMK-37 port, in one place.
#
# NACHTFAHRT (FartyPants/fm1-nachtfahrt) -> M-VAVE SMK-37.
# Filled from the owner's answers. Change this file first, then the code (AGENTS.md step 4).
# Patterns: fm1-to-smk37/docs/06-mapping-patterns.md

firmware:
  name: "NACHTFAHRT"        # the project's own name, unchanged on the SMK-37 (no "xxx37")
  upstream: "https://github.com/FartyPants/fm1-nachtfahrt"
  base: "v1.0.0"            # tag 33257686bfa4db94b31366aa2836f813d140764f; main ba07283 (2026-11-03)
  family: felucca           # Felucca-derived via X0X -> AMB-1 -> DUB-1 -> NACHTFAHRT; 17 firmware/hal/fm1_*.h
  board_layer: felucca      # genkigenki/Felucca branch smk37 (hugelton/Felucca#237), on Felucca 1.6
  lost_on_smk:              # told to the owner up front
    - "MASTER pot: the FM-1 has an absolute pot; the SMK has no pot, so K1 is a virtual MASTER (steps a stored value)"
    - "TRS MIDI IN: the FM-1's jack is MIDI IN on PH8; on the SMK PH8 is a key matrix row. The SMK jack is MIDI OUT only"
    - "no key LEDs on the SMK: the FM-1 lights the note keys; the SMK has pad RGB and the screen only"
  priorities:               # what must feel right on the SMK, most important first
    - "The piece plays itself on power-on: white keys give the melody in the piece's scale, black keys the 11 effects"
    - "All 14 FM-1 buttons and all 7 encoders reachable with the FM-1's own names and grouping"
    - "The four layers (Drone, Sequence, Lead, Sequence 2) plus Atmosphere have a direct control of their level"
    - "Sound first: nothing on the SMK needs a menu to make a noise"

delivery:
  mode: upstream            # a PR to FartyPants/fm1-nachtfahrt
  pr: ""                    # filled once opened
  fork: ""                  # the porter's fork of fm1-nachtfahrt, branch smk37
  package: "nachtfahrt-smk37-elite.fwsc"
  usb_name: "NACHTFAHRT SMK-37"   # was "DUB-1 FM-1" in firmware/src/usb.c STR2; renamed for this board
  data_family: upstream     # data survives switching between the fork and upstream; no clearing on a switch
  copyright: ""             # the porter's name in the new SMK files' headers

models:                     # all three from the start
  - pro
  - elite                   # the owner's unit
  - mke

keys:
  middle: fm1               # keys 5..31 (F3..G5) = the FM-1's 27 keys, velocity from the factory curves
  outer: extend             # more notes on synth tracks; C3-E3 and G#5-C6, confirmed
  outer_drums: []           # NACHTFAHRT has no drum track; outer keys always play notes
  velocity: factory         # the unit's calibration curves (trimdat at 0xC1000, read only)

pads:
  pattern: perform          # the layers and one big gesture, not a step grid
  order: reading            # pads 1-8 top row (hardware pads 0..7), 9-16 bottom (8..15)
  colours: screen           # the screen's layer colours, the same on the pads
  idle: dim                 # a sleeping layer still shows its colour, faintly
  playhead: bright          # a hit flashes bright
  picker:
    enabled: false          # the PRESETS knob already scrolls the 10 pieces
  velocity: true            # pads play with velocity
  notes:
    - "Top row, pads 1-5: mute Drone, Sequence, Lead, Sequence 2, Atmosphere (the FM-1's SEL white 1-5)"
    - "Bottom row, pads 9-13: solo the same five layers (the FM-1's SEL black 1-5)"
    - "Pad 6: the levels page. Pad 14: the Lead forgets its ideas and its theme"
    - "Pad 7: SWEEP. Pad 8: CHAOS, confirmed - drops both sequences out, opens the echo and the reverb, then lets the arc recover"
    - "Pad 15: drop both sequences out and back. Pad 16: LOCK"
    - "Each pad in its layer's screen colour; a muted layer dark, a soloed one bright, the held pad bright"
    - "Pads route to the firmware's own mute/solo/pick handlers so the button, the screen and the pads show one state"

faders:
  pattern: banks
  takeover: soft            # a fader acts only once it moves, also after a bank change
  bank_button: FADER BANK
  banks:                    # bank -> what fader 1..4 set
    A: [drone level, sequence level, lead level, sequence 2 level]
    B: [drone filter, sequence filter, lead filter, atmosphere level]   # confirmed: three filters, then the Atmosphere
    C: [reverb send, echo send, echo feedback, space]
    D: [evolve, motion, drift, energy]     # the NACHTFAHRT page's four knobs
  fixed: []
  screen: bank_screen       # a FADER BANK page showing all four banks; its LED lit off bank A

wheels:
  pitch:
    target: bend
    range_semitones: 2      # the FM-1 has no bend wheel; 2 suits the dreamy lead lines
    applies_to: selected
  mod:
    target: vibrato
    detail: "5.5 Hz, up to +-1/2 semitone; the Lead's own Vibrato knob stays the coarse setting"
  calibration: auto

rules:
  no_doubles: true
  doubles_allowed:
    - "K1 MASTER and the faders' A bank both reach a level: K1 is the output, the faders the layers"

knobs:
  layout: fm1               # K1 MASTER, K2-K4 the FM-1's encoders in the firmware's own screen order, K5-K8 the screen's four dials
  K1: master
  K2: select                # the FM-1's SELECT encoder
  K3: algorithm             # the FM-1's ALGORITHM encoder (the layer's voice)
  K4: presets               # the FM-1's PRESETS encoder (the piece)
  K5: dial 1
  K6: dial 2
  K7: dial 3
  K8: dial 4
  step: detent
  pages: {}                 # the firmware's screens are already knob-per-column

buttons:                    # the FM-1's 14 buttons keep their names and jobs
  map: printed
  names: firmware           # the firmware's own names: SEL, GLO, ENV, ARP, LFO, SEQ, SAVE, FX, ALGORITHM, PRESETS
  extra:                    # the four buttons the FM-1 does not have
    KNOB BANK: ""           # NACHTFAHRT has no knob banks; leave it doing nothing (or a page pin if the owner asks)
    FADER BANK: "the fader banks A-D"
    "<": page back
    ">": page forward

screen:
  style: keep               # the FM-1 UI, its own look and boot
  colours: "the layers keep their screen colours on the pads and the knob caps"
  rules:
    - group screens by meaning; the knob block at the bottom of the screen
    - the screen shows what you touch first (value next to the thing, a short hint line)
    - same colours and same places on screen and panel
    - no hidden modes; play first, few menus

pedal: none                 # the FM-1's "Pedal" is the Drone's sub-octave root, a parameter, not a foot pedal.
                            # The SMK pedal input stays unassigned unless the owner asks for sustain.

modes: {}                   # one UI

open_questions: []          # all four answered: CHAOS on pad 8, bank B three filters + Atmosphere, outer C3-E3 and G#5-C6, USB name NACHTFAHRT SMK-37
